<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OTF Fly Assistant</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 350px;
  background: #1e293b;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: #22c55e;
  padding: 10px;
  text-align: center;
  font-weight: bold;
}

.chat {
  height: 400px;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  margin: 8px 0;
}

.user {
  text-align: right;
}

.bot {
  text-align: left;
}

.input-area {
  display: flex;
  padding: 10px;
  background: #0f172a;
}

input {
  flex: 1;
  padding: 8px;
  border-radius: 5px;
  border: none;
}

button {
  margin-left: 5px;
  padding: 8px;
  border: none;
  border-radius: 5px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">✈️ OTF Fly Assistant</div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Écris un message...">
    <button onclick="sendMessage()">Envoyer</button>
    <button onclick="startListening()">🎤</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// VOIX SORTANTE
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "fr-FR";
  speechSynthesis.speak(speech);
}

// AJOUT MESSAGE
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// LOGIQUE BOT
function botResponse(message) {
  let msg = message.toLowerCase();
  let response = "";

  if (msg.includes("bonjour") || msg.includes("salut")) {
    response = "Bonjour 👋 bienvenue chez OTF Fly, comment puis-je vous aider ?";
  }
  else if (msg.includes("vol")) {
    response = "Donne-moi ta ville de départ et ta destination ✈️";
  }
  else if (msg.includes("dubai")) {
    response = "Vol Lagos → Dubai disponible à partir de 450$. Tu veux réserver ?";
  }
  else if (msg.includes("visa")) {
    response = "Pour quel pays veux-tu les informations de visa ?";
  }
  else if (msg.includes("france")) {
    response = "Visa France requis, délai 15 à 30 jours avec passeport et relevé bancaire.";
  }
  else if (msg.includes("agent")) {
    response = "Je te connecte à un agent OTF Fly 👨‍💼";
  }
  else {
    response = "Je peux t'aider pour vols ✈️, visa 🌍 ou réservation.";
  }

  addMessage(response, "bot");
  speak(response);
}

// ENVOI MESSAGE TEXTE
function sendMessage() {
  const text = input.value;
  if (text === "") return;

  addMessage(text, "user");
  input.value = "";
  botResponse(text);
}

// ENTRÉE CLAVIER
input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});

// VOIX ENTRANTE
function startListening() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "fr-FR";
  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    addMessage(text, "user");
    botResponse(text);
  };
}

// MESSAGE D’ACCUEIL
window.onload = () => {
  const welcome = "Bonjour 👋 bienvenue chez OTF Fly";
  addMessage(welcome, "bot");
  speak(welcome);
};
</script>

</body>
</html>
